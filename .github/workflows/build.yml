name: Build desktop applications

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macos
            artifact: macos-arm64
          - os: macos-15-intel
            platform: macos
            artifact: macos-intel
          - os: windows-latest
            platform: windows
            artifact: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Python tests
        run: python scripts/run_tests.py
      - name: Run interface state tests
        run: node --test tests/ui-state.test.js
      - name: Prepare official ADB
        run: python scripts/prepare_adb.py --platform ${{ matrix.platform }} --output build/adb
      - name: Build application
        run: python -m PyInstaller --noconfirm --workpath build/pyinstaller TVBootAdSwitch.spec
      - name: Check packaged application
        run: python scripts/check_bundle.py
      - name: Package macOS application
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent dist/TVBootAdSwitch.app release/TVBootAdSwitch-${{ matrix.artifact }}.zip
      - name: Package Windows application
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -Path dist/TVBootAdSwitch -DestinationPath release/TVBootAdSwitch-${{ matrix.artifact }}.zip
      - name: Upload checked package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tvboot-${{ matrix.artifact }}
          path: release/TVBootAdSwitch-${{ matrix.artifact }}.zip
          if-no-files-found: error
